<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Find the number</title>
</head>
<body>
    <header>
        <h1>Find the number</h1>
        <p>Bem-vindo ao jogo Find the number, o objetivo é acertar o numero secreto, você
            tem 10 tentativas. Boa Sorte!
        </p>
    </header>
    <main>
        <label for="numero">Digite um número: (1 - 100)</label>
        <input type="number" id="numero">
        
        <button id="botao" onclick="chutar()">Chutar</button>
        
        <p id="mensagem"></p>
        <p id="tentativas"></p> 
        <p id="historico"></p>
    </main>
</body>
</html>
